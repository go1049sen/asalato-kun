<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アサラトくん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{--page:#e9e6e1;--ink:#000;--btn:#166080;--btn-hi:#1d7aa3;--card:#f5f1ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1b1b1f}}
:root[data-theme="dark"]{--page:#1b1b1f}
html,body{margin:0;height:100%}
body{background:var(--page);display:flex;align-items:center;justify-content:center;font-family:"DotGothic16","BIZ UDGothic","Yu Gothic","Meiryo",monospace}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:#fff6d6;container-type:inline-size;overflow:hidden;box-shadow:inset 0 0 0 .7cqw #000}
#stage::after{content:"";position:absolute;inset:.7cqw;box-shadow:inset 0 0 0 .5cqw #166080;pointer-events:none}
.chara{position:absolute;display:block;image-rendering:pixelated;width:36%;height:auto;user-select:none;-webkit-user-drag:none}
#kun{left:4%;top:1cqw}
#pachika{right:4%;top:5.4cqw}
h1{position:absolute;left:0;right:0;top:38%;margin:0;text-align:center;font-size:8.6cqw;font-weight:400;color:#000;letter-spacing:.04em;line-height:1.1;text-shadow:.5cqw .5cqw 0 #f5a623,.55cqw 0 0 #000,0 .55cqw 0 #000}
button{position:absolute;background:var(--btn);color:#fff;border:0;border-radius:0;font:inherit;font-size:3.4cqw;letter-spacing:.12em;cursor:pointer;box-shadow:0 -.5cqw 0 0 #000,0 .5cqw 0 0 #000,-.5cqw 0 0 0 #000,.5cqw 0 0 0 #000,inset .5cqw .5cqw 0 0 #4aa6cf,inset -.5cqw -.5cqw 0 0 #0b3a4d,0 1.1cqw 0 0 #000}
button::before{content:"▶";position:absolute;left:1.4cqw;top:50%;transform:translateY(-50%);font-size:2.2cqw;color:#f5a623;opacity:0}
button:hover::before,button:focus-visible::before{opacity:1}
button:hover,button:focus-visible{background:var(--btn-hi);outline:0}
button:active{transform:translateY(.7cqw);box-shadow:0 -.5cqw 0 0 #000,-.5cqw 0 0 0 #000,.5cqw 0 0 0 #000,0 .5cqw 0 0 #000,inset -.5cqw -.5cqw 0 0 #4aa6cf,inset .5cqw .5cqw 0 0 #0b3a4d}

#start{left:25%;top:63%;width:23%;height:14%}
#cont{left:52%;top:63%;width:23%;height:14%}
#set{left:40%;top:82%;width:20%;height:9%;font-size:2.8cqw}
#toast{position:absolute;left:50%;bottom:1.8%;white-space:nowrap;transform:translateX(-50%);background:#000;color:#fff;padding:.8cqw 2cqw;font-size:2cqw;box-shadow:0 0 0 .4cqw #f5a623;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>

  <h1>アサラトくん</h1>
  <button id="start">はじめから</button>
  <button id="cont">続きから</button>
  <button id="set">設定</button>
  <div id="toast"></div>
</div>
<script>
// ---- ボタン ----
const toast=document.getElementById('toast');let tm;
function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>toast.classList.remove('on'),1600);}
document.getElementById('start').onclick=()=>say('はじめから:ここにゲーム開始の処理を書く');

</script>
